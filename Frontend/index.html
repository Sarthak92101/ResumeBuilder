<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <link rel="icon" type="image/png" href="/image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4fb" />
    <meta name="description" content="Build confidence for your next interview with personalized practice and feedback." />
    <title>SkillMirror · Interview preparation</title>
    <style>
      html, body { min-height: 100%; margin: 0; }
      body { background: #f4f4fb; color: #24233a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-splash { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .boot-splash__card { width: min(100%, 430px); padding: 32px; box-sizing: border-box; border: 1px solid #e5e4f0; border-radius: 24px; background: rgba(255,255,255,.82); box-shadow: 0 24px 80px rgba(47,42,100,.09); text-align: center; }
      .boot-splash__brand { display: inline-flex; align-items: center; gap: 9px; color: #37334f; font-size: 14px; font-weight: 750; }
      .boot-splash__mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; background: #6558e8; color: white; font-size: 10px; letter-spacing: .04em; }
      .boot-splash__visual { position: relative; display: grid; width: 120px; height: 120px; place-items: center; margin: 25px auto 20px; border-radius: 50%; background: radial-gradient(circle, #efedff 0 49%, transparent 50%); }
      .boot-splash__orbit { position: absolute; border: 1px solid #dcd8ff; border-radius: 50%; animation: boot-orbit 4s linear infinite; }
      .boot-splash__orbit--outer { inset: 0; border-right-color: #6558e8; }
      .boot-splash__orbit--inner { inset: 12px; border-style: dashed; animation-direction: reverse; animation-duration: 8s; }
      .boot-splash__document { position: relative; display: grid; width: 46px; height: 56px; align-content: center; gap: 6px; padding: 10px; box-sizing: border-box; border: 1px solid #dfdcf5; border-radius: 10px; background: white; box-shadow: 0 8px 22px rgba(65,58,137,.12); }
      .boot-splash__document span { height: 3px; border-radius: 4px; background: #dedbf0; }
      .boot-splash__document span:first-child { width: 70%; background: #a69ef4; }
      .boot-splash__document span:last-of-type { width: 55%; }
      .boot-splash__document i { position: absolute; right: -6px; bottom: -4px; width: 17px; height: 17px; border: 2px solid white; border-radius: 50%; background: #32b986; }
      .boot-splash__document i::after { content: ""; position: absolute; left: 5px; top: 3px; width: 4px; height: 7px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
      .boot-splash__eyebrow { color: #716e8c; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .boot-splash h1 { margin: 9px 0 7px; font-size: clamp(20px, 5vw, 25px); letter-spacing: -.04em; }
      .boot-splash p { margin: 0; color: #77758d; font-size: 14px; line-height: 1.55; }
      .boot-splash__steps { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 25px; color: #817e99; font-size: 10px; }
      .boot-splash__steps i { width: 18px; height: 1px; background: #dedbea; }
      .boot-splash__steps b { color: #6558e8; }
      @keyframes boot-orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash__orbit { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-splash" aria-label="Preparing SkillMirror">
        <section class="boot-splash__card">
          <div class="boot-splash__brand"><span class="boot-splash__mark">SM</span><span>SkillMirror</span></div>
          <div class="boot-splash__visual" aria-hidden="true">
            <span class="boot-splash__orbit boot-splash__orbit--outer"></span>
            <span class="boot-splash__orbit boot-splash__orbit--inner"></span>
            <div class="boot-splash__document"><span></span><span></span><span></span><i></i></div>
          </div>
          <span class="boot-splash__eyebrow">A little prep goes a long way</span>
          <h1>Getting your workspace ready</h1>
          <p>Setting up your interview preparation space.</p>
          <div class="boot-splash__steps" aria-hidden="true"><b>Your profile</b><i></i><span>Your next move</span><i></i><span>Ready to practice</span></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
